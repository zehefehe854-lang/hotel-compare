<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>购物比价</title>
<style>
body { background:#0f172a; color:#f1f5f9; font-family:-apple-system,'PingFang SC',sans-serif;
  display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
.loading { text-align:center; }
.loading .icon { font-size:48px; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.3; } }
</style>
</head>
<body>
<div class="loading">
  <div class="icon">🚀</div>
  <div style="margin-top:16px;font-size:14px">加载最新版...</div>
</div>
<script>
// 注销所有旧 Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(regs => {
    regs.forEach(r => r.unregister());
  });
}
// 跳转到最新版（新文件名绕过 CDN 缓存）
setTimeout(() => { location.href = 'app.html?v=12&t=' + Date.now(); }, 200);
</script>
</body>
</html>
